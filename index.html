<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elf Bowling</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100dvh;
        background: #000;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }
      #wrap {
        position: relative;
        width: min(100vw, calc(100dvh * 4 / 3));
        aspect-ratio: 4 / 3;
        margin: 0 auto;
        top: 50%;
        transform: translateY(-50%);
      }
      #stage {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        user-select: none;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        font-size: 24px;
      }
      #volume {
        position: fixed;
        right: 16px;
        bottom: 16px;
        width: 120px;
        opacity: 0.4;
        accent-color: #c00;
      }
      #volume:hover,
      #volume:focus-visible {
        opacity: 1;
      }
      #overlay[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="stage" width="640" height="480"></canvas>
      <div id="overlay"><p id="message"></p></div>
    </div>
    <input id="volume" type="range" min="0" max="1" step="0.01" aria-label="Volume" />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
